name: Prepare mod instance
description: Install fixtures and a built mod JAR into one side-specific instance

inputs:
  project:
    description: Mod project path
    required: false
    default: .
  artifact:
    description: JAR or directory containing exactly one JAR
    required: false
    default: .bertie-ci/artifact
  fixture:
    description: Comma-separated dependency fixture profiles
    required: false
    default: ""
  side:
    description: Instance side (client or server)
    required: true
  output-dir:
    description: Directory for the prepared instance and descriptor
    required: true

outputs:
  descriptor:
    description: Prepared instance descriptor
    value: ${{ inputs.output-dir }}/instance.json

runs:
  using: composite
  steps:
    - name: Prepare mod instance
      shell: bash
      env:
        BERTIE_CI_PROJECT: ${{ inputs.project }}
        BERTIE_CI_ARTIFACT: ${{ inputs.artifact }}
        BERTIE_CI_FIXTURE: ${{ inputs.fixture }}
        BERTIE_CI_SIDE: ${{ inputs.side }}
        BERTIE_CI_OUTPUT: ${{ inputs.output-dir }}
      run: >-
        nix run "${GITHUB_ACTION_PATH}/../..#bertie-ci" --
        prepare-mod-instance --project "$BERTIE_CI_PROJECT"
        --artifact "$BERTIE_CI_ARTIFACT" --fixture "$BERTIE_CI_FIXTURE"
        --side "$BERTIE_CI_SIDE" --output-dir "$BERTIE_CI_OUTPUT"
