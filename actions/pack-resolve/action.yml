name: Resolve pack downloads
description: Install selected pack sides to verify all downloads resolve

inputs:
  project:
    description: Packwiz project path
    required: false
    default: .
  side:
    description: Side to resolve (client, server, or both)
    required: false
    default: both
  output-dir:
    description: Ephemeral download directory
    required: false
    default: .bertie-ci/resolve

runs:
  using: composite
  steps:
    - name: Resolve pack downloads
      shell: bash
      env:
        BERTIE_CI_PROJECT: ${{ inputs.project }}
        BERTIE_CI_SIDE: ${{ inputs.side }}
        BERTIE_CI_OUTPUT: ${{ inputs.output-dir }}
      run: >-
        nix run "${GITHUB_ACTION_PATH}/../..#bertie-ci" --
        pack-resolve --project "$BERTIE_CI_PROJECT" --side "$BERTIE_CI_SIDE"
        --output-dir "$BERTIE_CI_OUTPUT"
