name: Run NeoForge GameTests
description: Run registered GameTests in the Gradle development runtime

inputs:
  project:
    description: Path to the mod checkout
    required: false
    default: .
  work-dir:
    description: Directory for the GameTest log
    required: false
    default: .bertie-ci
  timeout:
    description: Timeout in seconds
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Run GameTests
      shell: bash
      env:
        BERTIE_CI_PROJECT: ${{ inputs.project }}
        BERTIE_CI_WORK_DIR: ${{ inputs.work-dir }}
        BERTIE_CI_TIMEOUT: ${{ inputs.timeout }}
      run: >-
        nix run "${GITHUB_ACTION_PATH}/../..#bertie-ci" --
        gametest --project "$BERTIE_CI_PROJECT"
        --work-dir "$BERTIE_CI_WORK_DIR"
        --timeout "$BERTIE_CI_TIMEOUT"
