name: Validate pack
description: Refresh and inspect a packwiz pack in a temporary copy

inputs:
  project:
    description: Packwiz project path
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Validate pack
      shell: bash
      env:
        BERTIE_CI_PROJECT: ${{ inputs.project }}
      run: >-
        bertie-ci pack-validate --project "$BERTIE_CI_PROJECT"
