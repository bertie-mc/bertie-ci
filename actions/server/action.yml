name: Test Minecraft server
description: Verify that a built mod JAR reaches dedicated-server readiness

inputs:
  project:
    description: Project path used to resolve relative inputs
    required: false
    default: .
  artifact:
    description: JAR or directory containing exactly one JAR
    required: false
    default: .bertie-ci/artifact
  fixture:
    description: Comma-separated canonical mods or aggregate dependency profiles
    required: false
    default: ""
  work-dir:
    description: Directory for the server instance and logs
    required: false
    default: .bertie-ci/server
  cache-dir:
    description: Directory for downloaded Minecraft files
    required: false
    default: .bertie-ci/cache
  timeout:
    description: Timeout in seconds
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Reach dedicated-server readiness
      shell: bash
      env:
        BERTIE_CI_PROJECT: ${{ inputs.project }}
        BERTIE_CI_ARTIFACT: ${{ inputs.artifact }}
        BERTIE_CI_FIXTURE: ${{ inputs.fixture }}
        BERTIE_CI_WORK_DIR: ${{ inputs.work-dir }}
        BERTIE_CI_CACHE_DIR: ${{ inputs.cache-dir }}
        BERTIE_CI_TIMEOUT: ${{ inputs.timeout }}
      run: >-
        bertie-ci server --project "$BERTIE_CI_PROJECT"
        --artifact "$BERTIE_CI_ARTIFACT"
        --fixture "$BERTIE_CI_FIXTURE"
        --work-dir "$BERTIE_CI_WORK_DIR"
        --cache-dir "$BERTIE_CI_CACHE_DIR"
        --timeout "$BERTIE_CI_TIMEOUT"
