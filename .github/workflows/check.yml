name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  flake:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up bertie-ci
        uses: ./actions/setup

      - name: Check
        run: nix flake check

      - name: Smoke-test command
        run: bertie-ci --help
