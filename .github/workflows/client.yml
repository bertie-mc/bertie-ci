name: Client world join

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded mod JAR artifact to test
        required: true
        type: string
      fixture:
        description: Comma-separated dependency fixture profiles
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  client:
    name: Client world join
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup-nix@v3.2.1

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Test client
        uses: bertie-mc/bertie-ci/actions/client@v3.2.1
        with:
          fixture: ${{ inputs.fixture }}

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minecraft-client-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/client/**/*.log
            .bertie-ci/client/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
