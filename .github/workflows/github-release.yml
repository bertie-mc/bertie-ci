name: Publish GitHub release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded mod JAR artifact to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built mod
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/release

      - name: Create GitHub release
        uses: bertie-mc/bertie-ci/actions/github-release@v3.1.0
        with:
          files: .bertie-ci/release/*.jar
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
