name: Dedicated server readiness

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded mod JAR artifact to test
        required: true
        type: string
      fixture:
        description: Comma-separated dependency profiles sourced from the canonical pack
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  server:
    name: Dedicated server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup-nix@v3.4.1

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Prepare server instance
        uses: bertie-mc/bertie-ci/actions/prepare-mod-instance@v3.4.1
        with:
          artifact: .bertie-ci/artifact
          fixture: ${{ inputs.fixture }}
          side: server
          output-dir: .bertie-ci/server

      - name: Test server
        uses: bertie-mc/bertie-ci/actions/server-probe@v3.4.1
        with:
          instance: .bertie-ci/server/instance.json
          work-dir: .bertie-ci/server

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minecraft-server-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/server/**/*.log
            .bertie-ci/server/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
