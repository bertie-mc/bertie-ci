name: Publish GitHub release assets

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Uploaded artifact names to merge
        required: true
        type: string
      files:
        description: Newline-separated release file globs
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: .bertie-ci/release
          merge-multiple: true

      - name: Create GitHub release
        uses: bertie-mc/bertie-ci/actions/github-release@v3.3.2
        with:
          files: ${{ inputs.files }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
