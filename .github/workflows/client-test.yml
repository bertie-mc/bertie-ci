name: Project client integration suite

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded production mod JAR artifact to test
        required: true
        type: string
      fixture:
        description: Comma-separated canonical mods or aggregate dependency profiles
        required: false
        type: string
        default: ""
      build-test-mod:
        description: Build and install the conventional clientTest test-only mod
        required: false
        type: boolean
        default: false
      minimum-game-tests:
        description: Minimum number of project GameTests that must be discovered
        required: false
        type: number
        default: 0
      success-marker:
        description: Exact project-owned text required in the client runtime log
        required: false
        type: string
        default: ""
      max-memory:
        description: Maximum Java heap for the client
        required: false
        type: string
        default: 4G
      timeout:
        description: Client runtime timeout in seconds
        required: false
        type: number
        default: 1500

permissions:
  contents: read

jobs:
  client-test:
    name: Project client assertions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup@v4.0.0

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Build client test mod
        if: inputs.build-test-mod
        uses: bertie-mc/bertie-ci/actions/build-client-test-mod@v4.0.0

      - name: Prepare client instance
        uses: bertie-mc/bertie-ci/actions/prepare-mod-instance@v4.0.0
        with:
          artifact: .bertie-ci/artifact
          fixture: ${{ inputs.fixture }}
          side: client
          output-dir: .bertie-ci/client

      - name: Run client assertions
        uses: bertie-mc/bertie-ci/actions/client-test@v4.0.0
        with:
          instance: .bertie-ci/client/instance.json
          work-dir: .bertie-ci/client
          test-mod: ${{ inputs.build-test-mod && '.bertie-ci/client-test-mod/client-test-mod.jar' || '' }}
          minimum-game-tests: ${{ inputs.minimum-game-tests }}
          success-marker: ${{ inputs.success-marker }}
          timeout: ${{ inputs.timeout }}
          max-memory: ${{ inputs.max-memory }}

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-client-logs-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/client/**/*.log
            .bertie-ci/client/**/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
