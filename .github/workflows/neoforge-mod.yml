name: NeoForge mod runtime

on:
  workflow_call:
    inputs:
      sides:
        description: Runtime sides to test (client, server, or both)
        required: false
        type: string
        default: both
      tool-ref:
        description: bertie-ci Git ref used by the local-first runner
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (${{ inputs.sides }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build and run Minecraft
        env:
          BERTIE_CI_CACHE_DIR: ${{ runner.temp }}/bertie-ci-cache
        run: |
          nix run "github:bertie-mc/bertie-ci/${{ inputs.tool-ref }}#bertie-ci" -- \
            mod --project . --sides '${{ inputs.sides }}' \
            --cache-dir "$BERTIE_CI_CACHE_DIR"

      - name: Upload built mod
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mod-${{ github.repository_id }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minecraft-runtime-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/**/*.log
            .bertie-ci/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
