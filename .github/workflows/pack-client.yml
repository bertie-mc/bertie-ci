name: Pack client world join

on:
  workflow_call:
    inputs:
      timeout:
        description: Probe timeout in seconds
        required: false
        type: number
        default: 4800
      max-memory:
        description: Maximum Java heap
        required: false
        type: string
        default: 10G

permissions:
  contents: read

jobs:
  client:
    name: Pack client world join
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup-nix@v3.3.3

      - name: Prepare client pack
        uses: bertie-mc/bertie-ci/actions/prepare-pack-instance@v3.3.3
        with:
          side: client
          output-dir: .bertie-ci/client

      - name: Join an integrated world
        uses: bertie-mc/bertie-ci/actions/client-probe@v3.3.3
        with:
          instance: .bertie-ci/client/instance.json
          work-dir: .bertie-ci/client
          timeout: ${{ inputs.timeout }}
          max-memory: ${{ inputs.max-memory }}

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pack-client-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/client/**/*.log
            .bertie-ci/client/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
