name: Project server integration suite

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded production mod JAR artifact to test
        required: true
        type: string
      fixture:
        description: Comma-separated canonical mods or aggregate dependency profiles
        required: false
        type: string
        default: ""
      command-test:
        description: Optional project-owned HeadlessMC command-test JSON
        required: false
        type: string
        default: ""
      test-mod-artifact-name:
        description: Optional uploaded artifact containing exactly one test-only mod JAR
        required: false
        type: string
        default: ""
      success-marker:
        description: Exact project-owned text required in the server runtime log
        required: false
        type: string
        default: ""
      max-memory:
        description: Maximum Java heap for the server
        required: false
        type: string
        default: 3G
      timeout:
        description: Server runtime timeout in seconds
        required: false
        type: number
        default: 900

permissions:
  contents: read

jobs:
  server-test:
    name: Project server integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup@v4.0.0

      - name: Download built mod
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .bertie-ci/artifact

      - name: Download test mod
        if: inputs.test-mod-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.test-mod-artifact-name }}
          path: .bertie-ci/test-mod-artifact

      - name: Prepare server instance
        uses: bertie-mc/bertie-ci/actions/prepare-mod-instance@v4.0.0
        with:
          artifact: .bertie-ci/artifact
          fixture: ${{ inputs.fixture }}
          side: server
          output-dir: .bertie-ci/server

      - name: Test prepared server
        uses: bertie-mc/bertie-ci/actions/server-test@v4.0.0
        with:
          instance: .bertie-ci/server/instance.json
          work-dir: .bertie-ci/server
          command-test: ${{ inputs.command-test }}
          test-mod: ${{ inputs.test-mod-artifact-name != '' && '.bertie-ci/test-mod-artifact' || '' }}
          success-marker: ${{ inputs.success-marker }}
          timeout: ${{ inputs.timeout }}
          max-memory: ${{ inputs.max-memory }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-server-logs-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/server/**/*.log
            .bertie-ci/server/**/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
