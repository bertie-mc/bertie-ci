name: Pack dedicated server

on:
  workflow_call:
    inputs:
      timeout:
        description: Probe timeout in seconds
        required: false
        type: number
        default: 4500
      max-memory:
        description: Maximum Java heap
        required: false
        type: string
        default: 8G

permissions:
  contents: read

jobs:
  server:
    name: Pack dedicated server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup@v3.6.0

      - name: Prepare server pack
        uses: bertie-mc/bertie-ci/actions/prepare-pack-instance@v3.6.0
        with:
          side: server
          output-dir: .bertie-ci/server

      - name: Reach dedicated-server readiness
        uses: bertie-mc/bertie-ci/actions/server-probe@v3.6.0
        with:
          instance: .bertie-ci/server/instance.json
          work-dir: .bertie-ci/server
          timeout: ${{ inputs.timeout }}
          max-memory: ${{ inputs.max-memory }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pack-server-${{ github.repository_id }}-${{ github.sha }}
          path: |
            .bertie-ci/server/**/*.log
            .bertie-ci/server/**/crash-reports/
          if-no-files-found: warn
          retention-days: 14
