name: JVM unit tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up dependencies
        uses: bertie-mc/bertie-ci/actions/setup-nix@v3.1.1

      - name: Run unit tests
        uses: bertie-mc/bertie-ci/actions/unit-test@v3.1.1

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-${{ github.repository_id }}-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14
